# Replaces the nginx image's stock /etc/nginx/conf.d/default.conf so the
# server block can carry site-specific locations. IPv4 only, matching what
# runs in the cluster: its read-only root filesystem stops the image's IPv6
# entrypoint script from adding a [::]:80 listener.
server {
    listen       80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Kubernetes liveness/readiness probes. Not logged: probes would
    # otherwise dominate the access log.
    location = /healthz {
        access_log off;
        return 200;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
