# Replaces the nginx image's stock /etc/nginx/conf.d/default.conf so the
# server block can carry site-specific locations. IPv4 only, matching what
# runs in the cluster: its read-only root filesystem stops the image's IPv6
# entrypoint script from adding a [::]:80 listener.
server {
    listen       80;
    server_name  localhost;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Astro's build output: every filename carries a content hash, so a
    # changed file always gets a new URL and these can be cached forever.
    # add_header here drops the server-level ones, hence the re-include.
    # Cache-Control has no `always`: a 404 here (e.g. a new hash requested
    # from a not-yet-updated pod mid-rollout) must not be cached for a year.
    location ^~ /_astro/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Kubernetes liveness/readiness probes. Not logged: probes would
    # otherwise dominate the access log.
    location = /healthz {
        access_log off;
        return 200;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
