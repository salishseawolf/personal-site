# Requests reach this container via the cluster ingress, so $remote_addr is
# the ingress's node address on the pod network (k3s cluster-cidr
# 10.42.0.0/16), not the visitor. Trust X-Forwarded-For only from that range
# and take the right-most address that isn't itself a trusted hop.
#
# The range is broader than just the ingress (any pod could set the header),
# which is acceptable while the real IP is only used for logging. Narrow it
# before nginx acts on the IP (deny, per-IP limit_req).
set_real_ip_from 10.42.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
