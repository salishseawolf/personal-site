# Included in the server block and in every location that sets its own
# add_header (nginx drops inherited add_header directives in that case).
# `always` so error responses (404 etc.) carry them too. HSTS is set by the
# cluster ingress, not here.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Report-only: browsers log violations to the console but block nothing.
# $csp_script_hashes allows the site's inline scripts by hash; it's defined in
# conf.d/csp-script-hashes.conf, generated at image build from the built site.
# worker-src blob: is for Umami's recorder.js, which starts a Worker from a
# blob: URL.
add_header Content-Security-Policy-Report-Only "script-src 'self' $csp_script_hashes https://umami.salishseawolf.com; connect-src 'self' https://umami.salishseawolf.com; worker-src 'self' blob:" always;
